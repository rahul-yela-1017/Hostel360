services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: smart_hostel
      MYSQL_USER: hostel_user
      MYSQL_PASSWORD: change-me
      MYSQL_ROOT_PASSWORD: change-root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
    ports: ["8000:8000"]

  web:
    build: ./frontend
    depends_on: [api]
    ports: ["8080:80"]

volumes:
  mysql_data:
